[package]
name = "cozy-perft"
version = "0.1.0"
edition = "2021"
publish = false
description = "Minimal UCI wrapper around the cozy-chess crate for PerftWar."

[[bin]]
name = "cozy-perft"
path = "src/main.rs"

[dependencies]
# Pull cozy-chess from crates.io. Pinned to the 0.3 line — if the API
# drifts in 0.4+, this constraint will need bumping (and the wrapper
# may need a small edit; see wrappers/README.md).
cozy-chess = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
