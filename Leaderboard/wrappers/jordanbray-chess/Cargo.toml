[package]
name = "jordan-perft"
version = "0.1.0"
edition = "2021"
publish = false
description = "Minimal UCI wrapper around the jordanbray/chess crate for PerftWar."

[[bin]]
name = "jordan-perft"
path = "src/main.rs"

[dependencies]
# jordanbray's foundational Rust chess library, on crates.io as `chess`.
chess = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
