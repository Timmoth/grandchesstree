              <li role="none"><a role="menuitem" href="{{BASE}}gpu-leaderboard.html" class="block px-4 py-2 text-slate-700 hover:bg-slate-50 hover:text-slate-900 {{NAV_GPU_LEADERBOARD}}">GPU</a></li>

        <button

          aria-expanded="false"
          aria-controls="mobile-nav-menu"
          aria-label="Toggle navigation menu"
        >

          <li>
            <a href="https://github.com/Timmoth/grandchesstree" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 rounded-md px-3 py-2 hover:bg-slate-50">

      <script>
        (function () {
          // Mobile menu toggle (unchanged behaviour, kept here so the header
          // is self-contained).
          var toggle = document.getElementById("mobile-nav-toggle");
          var menu = document.getElementById("mobile-nav-menu");
          var openIcon = document.getElementById("mobile-nav-open-icon");
          var closeIcon = document.getElementById("mobile-nav-close-icon");
          if (toggle && menu) {
            toggle.addEventListener("click", function () {
              var nowOpen = menu.classList.toggle("hidden") === false;
              openIcon.classList.toggle("hidden", nowOpen);
              closeIcon.classList.toggle("hidden", !nowOpen);
              toggle.setAttribute("aria-expanded", nowOpen ? "true" : "false");
            });
          }

          // Leaderboards dropdown — click to open, click-outside or Escape
          // to close. Pure JS, no library; mobile uses an always-expanded
          // sub-list instead so this only runs on >= md screens.
          var ddToggle = document.getElementById("leaderboards-dropdown-toggle");
          var ddMenu = document.getElementById("leaderboards-dropdown-menu");
          if (ddToggle && ddMenu) {
            function setOpen(open) {
              ddMenu.classList.toggle("hidden", !open);
              ddToggle.setAttribute("aria-expanded", open ? "true" : "false");
            }
            ddToggle.addEventListener("click", function (e) {
              e.stopPropagation();
              setOpen(ddMenu.classList.contains("hidden"));
            });
            document.addEventListener("click", function (e) {
              if (ddMenu.classList.contains("hidden")) return;
              if (!ddMenu.contains(e.target) && !ddToggle.contains(e.target)) {
                setOpen(false);
              }
            });
            document.addEventListener("keydown", function (e) {
              if (e.key === "Escape" && !ddMenu.classList.contains("hidden")) {
                setOpen(false);
                ddToggle.focus();
              }
            });
          }
        })();
      </script>
